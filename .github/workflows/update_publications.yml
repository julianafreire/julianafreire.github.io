name: Update publications

on:
  push:
    paths:
      - "files/freire.bib"
      - "scripts/generate_publications.py"
      - "requirements-publications.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install -r requirements-publications.txt
      - run: python scripts/generate_publications.py
      - name: Commit generated publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _publications
          git diff --cached --quiet || git commit -m "Update publications from freire.bib"
          git push